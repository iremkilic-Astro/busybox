name: BusyBox AArch64 RootFS Build

on:
  workflow_dispatch:
    inputs:
      busybox_version:
        description: "BusyBox version (e.g. 1.36.1)"
        required: false
        default: "1.36.1"

env:
  BUSYBOX_VERSION: ${{ github.event.inputs.busybox_version || '1.36.1' }}
  ARCH: aarch64
  CROSS_COMPILE: aarch64-linux-musl-
  OUTPUT_DIR: ${{ github.workspace }}/output
  ROOTFS_DIR: ${{ github.workspace }}/rootfs
  SYSROOT: ${{ github.workspace }}/sysroot

jobs:
  setup-toolchain:
    name: "Setup AArch64 musl toolchain"
    runs-on: ubuntu-24.04
    outputs:
      toolchain-path: ${{ steps.install.outputs.toolchain_path }}

    steps:
      - name: Install cross-compilation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            wget curl tar xz-utils make gcc g++ \
            libncurses-dev bc bison flex \
            libssl-dev libelf-dev file cpio

      - name: Download musl cross-compiler (aarch64-linux-musl)
        id: install
        run: |
          TOOLCHAIN_URL="https://musl.cc/aarch64-linux-musl-cross.tgz"
          wget -q "$TOOLCHAIN_URL" -O /tmp/toolchain.tgz
          sudo tar -xzf /tmp/toolchain.tgz -C /opt/
          TPATH="/opt/aarch64-linux-musl-cross/bin"
          echo "$TPATH" >> $GITHUB_PATH
          echo "toolchain_path=$TPATH" >> $GITHUB_OUTPUT
          echo "✓ Toolchain: $(${TPATH}/aarch64-linux-musl-gcc --version | head -1)"

      - name: Cache toolchain
        uses: actions/cache/save@v4
        with:
          path: /opt/aarch64-linux-musl-cross
          key: toolchain-aarch64-musl-${{ runner.os }}

  build-busybox:
    name: "Build BusyBox (static, AArch64)"
    runs-on: ubuntu-24.04
    needs: setup-toolchain

    steps:
      - name: Restore toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: /opt/aarch64-linux-musl-cross
          key: toolchain-aarch64-musl-${{ runner.os }}

      - name: Add toolchain to PATH
        run: echo "/opt/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            make gcc libncurses-dev wget

      - name: Download BusyBox source
        run: |
          wget -q "https://busybox.net/downloads/busybox-${BUSYBOX_VERSION}.tar.bz2" \
            -O /tmp/busybox.tar.bz2
          tar -xjf /tmp/busybox.tar.bz2 -C $GITHUB_WORKSPACE
          echo "BUSYBOX_SRC=$GITHUB_WORKSPACE/busybox-${BUSYBOX_VERSION}" >> $GITHUB_ENV

      - name: Generate defconfig
        run: |
          cd "$BUSYBOX_SRC"
          make ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE defconfig

      - name: Apply custom kconfig
        run: |
          cd "$BUSYBOX_SRC"

          scripts/config --enable  CONFIG_STATIC
          scripts/config --disable CONFIG_FEATURE_HAVE_RPC
          scripts/config --disable CONFIG_PAM

          scripts/config --enable CONFIG_LS
          scripts/config --enable CONFIG_CAT
          scripts/config --enable CONFIG_MOUNT
          scripts/config --enable CONFIG_UMOUNT
          scripts/config --enable CONFIG_MKDIR
          scripts/config --enable CONFIG_RM
          scripts/config --enable CONFIG_CP
          scripts/config --enable CONFIG_MV
          scripts/config --enable CONFIG_CHMOD
          scripts/config --enable CONFIG_CHOWN
          scripts/config --enable CONFIG_ECHO
          scripts/config --enable CONFIG_FIND
          scripts/config --enable CONFIG_GREP
          scripts/config --enable CONFIG_SED
          scripts/config --enable CONFIG_AWK
          scripts/config --enable CONFIG_SORT
          scripts/config --enable CONFIG_TAIL
          scripts/config --enable CONFIG_HEAD
          scripts/config --enable CONFIG_WC
          scripts/config --enable CONFIG_UNIQ
          scripts/config --enable CONFIG_TEE
          scripts/config --enable CONFIG_XARGS
          scripts/config --enable CONFIG_EXPR
          scripts/config --enable CONFIG_TEST
          scripts/config --enable CONFIG_DATE
          scripts/config --enable CONFIG_UNAME
          scripts/config --enable CONFIG_WHOAMI
          scripts/config --enable CONFIG_HOSTNAME
          scripts/config --enable CONFIG_PRINTENV
          scripts/config --enable CONFIG_ENV
          scripts/config --enable CONFIG_SLEEP
          scripts/config --enable CONFIG_KILL
          scripts/config --enable CONFIG_PS
          scripts/config --enable CONFIG_FREE
          scripts/config --enable CONFIG_DF
          scripts/config --enable CONFIG_DU
          scripts/config --enable CONFIG_STAT
          scripts/config --enable CONFIG_LN
          scripts/config --enable CONFIG_READLINK
          scripts/config --enable CONFIG_BASENAME
          scripts/config --enable CONFIG_DIRNAME
          scripts/config --enable CONFIG_TRUE
          scripts/config --enable CONFIG_FALSE
          scripts/config --enable CONFIG_YES
          scripts/config --enable CONFIG_PWD
          scripts/config --enable CONFIG_SYNC
          scripts/config --enable CONFIG_MKNOD
          scripts/config --enable CONFIG_MKTEMP
          scripts/config --enable CONFIG_HEXDUMP
          scripts/config --enable CONFIG_OD
          scripts/config --enable CONFIG_DD
          scripts/config --enable CONFIG_TAR
          scripts/config --enable CONFIG_GUNZIP
          scripts/config --enable CONFIG_GZIP
          scripts/config --enable CONFIG_BUNZIP2
          scripts/config --enable CONFIG_BZCAT
          scripts/config --enable CONFIG_UNXZ
          scripts/config --enable CONFIG_XZ

          scripts/config --enable CONFIG_IP
          scripts/config --enable CONFIG_IFCONFIG
          scripts/config --enable CONFIG_UDHCPC
          scripts/config --enable CONFIG_UDHCPD
          scripts/config --enable CONFIG_WGET
          scripts/config --enable CONFIG_CURL          # BusyBox curl (libcurl bağımlı değil)
          scripts/config --enable CONFIG_PING
          scripts/config --enable CONFIG_PING6
          scripts/config --enable CONFIG_TRACEROUTE
          scripts/config --enable CONFIG_TRACEROUTE6
          scripts/config --enable CONFIG_NETSTAT
          scripts/config --enable CONFIG_ARP
          scripts/config --enable CONFIG_ROUTE
          scripts/config --enable CONFIG_NSLOOKUP
          scripts/config --enable CONFIG_HOST
          scripts/config --enable CONFIG_TELNET
          scripts/config --enable CONFIG_NC
          scripts/config --enable CONFIG_FTPGET
          scripts/config --enable CONFIG_FTPPUT
          scripts/config --enable CONFIG_HTTPD
          scripts/config --enable CONFIG_DNSD
          scripts/config --enable CONFIG_NAMEIF
          scripts/config --enable CONFIG_IPCALC
          scripts/config --enable CONFIG_ETHER_WAKE
          scripts/config --enable CONFIG_FEATURE_IP_ADDRESS
          scripts/config --enable CONFIG_FEATURE_IP_LINK
          scripts/config --enable CONFIG_FEATURE_IP_ROUTE
          scripts/config --enable CONFIG_FEATURE_IP_RULE
          scripts/config --enable CONFIG_FEATURE_IP_TUNNEL
          scripts/config --enable CONFIG_FEATURE_IP_NEIGH
          scripts/config --enable CONFIG_FEATURE_UDHCPC_ARPING
          scripts/config --enable CONFIG_FEATURE_UDHCP_RFC3397
          scripts/config --enable CONFIG_FEATURE_UDHCP_8021Q

          scripts/config --enable CONFIG_INIT
          scripts/config --enable CONFIG_LINUXRC
          scripts/config --enable CONFIG_SYSVINIT
          scripts/config --enable CONFIG_HALT
          scripts/config --enable CONFIG_REBOOT
          scripts/config --enable CONFIG_POWEROFF
          scripts/config --enable CONFIG_GETTY
          scripts/config --enable CONFIG_LOGIN
          scripts/config --enable CONFIG_SH
          scripts/config --enable CONFIG_ASH
          scripts/config --enable CONFIG_HUSH
          scripts/config --enable CONFIG_SYSLOGD
          scripts/config --enable CONFIG_KLOGD
          scripts/config --enable CONFIG_DMESG

          scripts/config --enable CONFIG_MOUNT
          scripts/config --enable CONFIG_FEATURE_MOUNT_FLAGS
          scripts/config --enable CONFIG_FEATURE_MOUNT_FSTAB
          scripts/config --enable CONFIG_FEATURE_MOUNT_HELPERS
          scripts/config --enable CONFIG_FEATURE_MOUNT_LABEL
          scripts/config --enable CONFIG_LOSETUP
          scripts/config --enable CONFIG_FSCK
          scripts/config --enable CONFIG_MKFS_EXT2
          scripts/config --enable CONFIG_TUNE2FS
          scripts/config --enable CONFIG_E2FSCK
          scripts/config --enable CONFIG_MKFS_VFAT
          scripts/config --enable CONFIG_FATATTR
          scripts/config --enable CONFIG_FSTRIM
          scripts/config --enable CONFIG_SWAPON
          scripts/config --enable CONFIG_SWAPOFF

          scripts/config --enable CONFIG_MODPROBE
          scripts/config --enable CONFIG_INSMOD
          scripts/config --enable CONFIG_RMMOD
          scripts/config --enable CONFIG_LSMOD
          scripts/config --enable CONFIG_DEPMOD

          scripts/config --enable CONFIG_STTY
          scripts/config --enable CONFIG_CHROOT
          scripts/config --enable CONFIG_PIVOT_ROOT
          scripts/config --enable CONFIG_SWITCH_ROOT
          scripts/config --enable CONFIG_LSPCI
          scripts/config --enable CONFIG_LSUSB
          scripts/config --enable CONFIG_HDPARM
          scripts/config --enable CONFIG_FDISK
          scripts/config --enable CONFIG_SFDISK
          scripts/config --enable CONFIG_BLKID
          scripts/config --enable CONFIG_FINDFS
          scripts/config --enable CONFIG_NSENTER
          scripts/config --enable CONFIG_UNSHARE
          scripts/config --enable CONFIG_CHRT
          scripts/config --enable CONFIG_TASKSET
          scripts/config --enable CONFIG_NICE
          scripts/config --enable CONFIG_IONICE

          make ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE \
            olddefconfig 2>&1 | tail -20

      - name: Compile BusyBox
        run: |
          cd "$BUSYBOX_SRC"
          make -j$(nproc) \
            ARCH=arm64 \
            CROSS_COMPILE=$CROSS_COMPILE \
            V=0 2>&1 | tee /tmp/busybox-build.log
          echo "✓ Build complete"
          file busybox
          ls -lh busybox

      - name: Verify static linking
        run: |
          cd "$BUSYBOX_SRC"
          LIBS=$(${CROSS_COMPILE}readelf -d busybox | grep NEEDED || true)
          if [ -n "$LIBS" ]; then
            echo "❌ HATA: Binary statik değil! Shared lib bulundu:"
            echo "$LIBS"
            exit 1
          fi
          echo "✓ Binary tamamen statik (shared lib yok)"

      - name: Upload busybox binary
        uses: actions/upload-artifact@v4
        with:
          name: busybox-aarch64
          path: ${{ env.BUSYBOX_SRC }}/busybox
          retention-days: 7

  build-rootfs:
    name: "Build RootFS"
    runs-on: ubuntu-24.04
    needs: build-busybox

    steps:
      - name: Checkout (init scripts için)
        uses: actions/checkout@v4

      - name: Download busybox binary
        uses: actions/download-artifact@v4
        with:
          name: busybox-aarch64
          path: /tmp/busybox-bin

      - name: Create rootfs directory structure
        run: |
          mkdir -p $ROOTFS_DIR/{bin,sbin,usr/bin,usr/sbin,lib,lib64,etc,proc,sys,dev,tmp,run,var/{log,run},mnt,root,home}
          mkdir -p $ROOTFS_DIR/etc/{init.d,network/if-up.d,network/if-down.d,udhcpc}
          mkdir -p $ROOTFS_DIR/usr/{lib,share}
          mkdir -p $ROOTFS_DIR/dev

          chmod 1777 $ROOTFS_DIR/tmp
          chmod 700  $ROOTFS_DIR/root
          echo "✓ Dizin yapısı oluşturuldu"

      - name: Install busybox and create symlinks
        run: |
          install -m 755 /tmp/busybox-bin/busybox $ROOTFS_DIR/bin/busybox

          for applet in $($ROOTFS_DIR/bin/busybox --list 2>/dev/null || \
            aarch64-linux-musl-objdump -d /tmp/busybox-bin/busybox | \
            grep -oP '(?<=applet_names\+)\w+' || \
            cat <<-EOF
            ls cat mount umount mkdir rm cp mv chmod chown echo find grep sed
            awk sort tail head wc uniq tee xargs expr test date uname whoami
            hostname printenv env sleep kill ps free df du stat ln readlink
            basename dirname true false yes pwd sync mknod mktemp hexdump od dd
            tar gunzip gzip bunzip2 bzcat unxz xz ip ifconfig udhcpc udhcpd
            wget ping ping6 traceroute netstat arp route nslookup nc telnet
            ftpget ftpput httpd ipcalc init sh ash hush syslogd klogd dmesg
            getty login halt reboot poweroff modprobe insmod rmmod lsmod
            chroot pivot_root switch_root stty blkid fdisk sfdisk losetup
            nsenter unshare chrt taskset nice ionice
          EOF
          ); do
            applet=$(echo $applet | tr -d ' ')
            [ -z "$applet" ] && continue
            case "$applet" in
              mount|umount|ifconfig|ip|route|arp|modprobe|insmod|rmmod|\
              lsmod|depmod|swapon|swapoff|pivot_root|switch_root|losetup|\
              fdisk|sfdisk|blkid|fsck|getty|halt|reboot|poweroff|init)
                ln -sf /bin/busybox $ROOTFS_DIR/sbin/$applet 2>/dev/null || true
                ;;
              *)
                ln -sf /bin/busybox $ROOTFS_DIR/bin/$applet 2>/dev/null || true
                ;;
            esac
          done
          echo "✓ BusyBox symlink'leri oluşturuldu"

      - name: Create /etc/inittab
        run: |
          cat > $ROOTFS_DIR/etc/inittab <<'EOF'

          ::sysinit:/etc/init.d/rcS

          console::respawn:/sbin/getty -L console 0 vt100
          ttyS0::respawn:/sbin/getty -L ttyS0 115200 vt100
          ttyAMA0::respawn:/sbin/getty -L ttyAMA0 115200 vt100

          ::ctrlaltdel:/sbin/reboot

          ::shutdown:/etc/init.d/rcK
          ::shutdown:/bin/umount -a -r
          ::shutdown:/sbin/swapoff -a
          EOF

      - name: Create /etc/init.d/rcS (sysinit)
        run: |
          cat > $ROOTFS_DIR/etc/init.d/rcS <<'SCRIPT'

          echo "==> BusyBox AArch64 RootFS başlatılıyor..."

          echo "[mount] /proc"
          if ! mountpoint -q /proc; then
            mount -t proc     proc     /proc     \
              -o nosuid,noexec,nodev
            [ $? -eq 0 ] && echo "  ✓ /proc mount edildi" \
                         || echo "  ✗ /proc mount HATA!"
          else
            echo "  ✓ /proc zaten mount"
          fi

          echo "[mount] /sys"
          if ! mountpoint -q /sys; then
            mount -t sysfs    sysfs    /sys      \
              -o nosuid,noexec,nodev
            [ $? -eq 0 ] && echo "  ✓ /sys mount edildi" \
                         || echo "  ✗ /sys mount HATA!"
          else
            echo "  ✓ /sys zaten mount"
          fi

          if [ -d /sys/kernel/security ]; then
            mountpoint -q /sys/kernel/security || \
              mount -t securityfs security /sys/kernel/security \
                -o nosuid,noexec,nodev 2>/dev/null || true
          fi

          echo "[mount] /dev"
          if ! mountpoint -q /dev; then
            mount -t devtmpfs devtmpfs /dev       \
              -o nosuid,mode=0755
            if [ $? -ne 0 ]; then
              echo "  ! devtmpfs yok, tmpfs+mknod kullanılıyor"
              mount -t tmpfs tmpfs /dev -o nosuid,mode=0755,size=64k
              mknod -m 666 /dev/null    c 1 3
              mknod -m 666 /dev/zero    c 1 5
              mknod -m 666 /dev/random  c 1 8
              mknod -m 666 /dev/urandom c 1 9
              mknod -m 600 /dev/console c 5 1
              mknod -m 666 /dev/tty     c 5 0
              mknod -m 660 /dev/ttyS0   c 4 64
              mknod -m 660 /dev/ttyAMA0 c 204 64
            fi
            echo "  ✓ /dev mount edildi"
          fi

          mkdir -p /dev/pts
          if ! mountpoint -q /dev/pts; then
            mount -t devpts devpts /dev/pts \
              -o nosuid,noexec,gid=5,mode=0620
            [ $? -eq 0 ] && echo "  ✓ /dev/pts mount edildi" || true
          fi

          mkdir -p /dev/shm
          if ! mountpoint -q /dev/shm; then
            mount -t tmpfs shm /dev/shm \
              -o nosuid,nodev,noexec,mode=1777
            [ $? -eq 0 ] && echo "  ✓ /dev/shm mount edildi" || true
          fi

          echo "[mount] /run"
          if ! mountpoint -q /run; then
            mount -t tmpfs tmpfs /run \
              -o nosuid,nodev,noexec,mode=0755,size=128m
            [ $? -eq 0 ] && echo "  ✓ /run mount edildi" || true
          fi

          if ! mountpoint -q /tmp; then
            mount -t tmpfs tmpfs /tmp \
              -o nosuid,nodev,noexec,mode=1777,size=128m
            [ $? -eq 0 ] && echo "  ✓ /tmp mount edildi" || true
          fi

          HOSTNAME=$(cat /etc/hostname 2>/dev/null || echo "busybox-aarch64")
          hostname "$HOSTNAME"
          echo "  ✓ Hostname: $HOSTNAME"

          sysctl -q -p /etc/sysctl.conf 2>/dev/null || true

          echo "[network] loopback"
          ip link set lo up 2>/dev/null || ifconfig lo up 2>/dev/null || true
          ip addr add 127.0.0.1/8 dev lo 2>/dev/null || true
          echo "  ✓ lo arayüzü aktif"

          echo "[network] eth0"
          if ip link show eth0 > /dev/null 2>&1; then
            ip link set eth0 up
            echo "  → eth0 up, DHCP başlatılıyor..."
            udhcpc -i eth0 -s /etc/udhcpc/default.script \
              -b -t 5 -T 3 -A 10 \
              -p /run/udhcpc.eth0.pid 2>/dev/null || \
            udhcpc -i eth0 -b 2>/dev/null || true
          else
            echo "  ! eth0 bulunamadı, ağ arayüzleri:"
            ip link show 2>/dev/null | grep -E "^[0-9]" || true
          fi

          [ ! -f /etc/resolv.conf ] && cat > /etc/resolv.conf <<RESOLVEOF
          nameserver 8.8.8.8
          nameserver 1.1.1.1
          RESOLVEOF

          syslogd -C 64 2>/dev/null || true
          klogd -c 3   2>/dev/null || true

          echo "==> Başlangıç tamamlandı!"
          echo "    Kernel: $(uname -r)"
          echo "    Arch  : $(uname -m)"
          SCRIPT
          chmod +x $ROOTFS_DIR/etc/init.d/rcS

      - name: Create /etc/init.d/rcK (shutdown)
        run: |
          cat > $ROOTFS_DIR/etc/init.d/rcK <<'SCRIPT'

          echo "==> Sistem kapatılıyor..."

          ip link set eth0 down 2>/dev/null || ifconfig eth0 down 2>/dev/null || true
          ip link set lo down  2>/dev/null || ifconfig lo  down 2>/dev/null || true

          [ -f /run/udhcpc.eth0.pid ] && kill $(cat /run/udhcpc.eth0.pid) 2>/dev/null || true

          echo "  ✓ Ağ bağlantıları kapatıldı"
          echo "==> Güvenli kapatma hazır"
          SCRIPT
          chmod +x $ROOTFS_DIR/etc/init.d/rcK

      - name: Create udhcpc default script
        run: |
          cat > $ROOTFS_DIR/etc/udhcpc/default.script <<'SCRIPT'

          [ -z "$1" ] && echo "Kullanım: $0 <bound|renew|deconfig|leasefail>" && exit 1

          RESOLV=/etc/resolv.conf

          case "$1" in
            deconfig)
              ip addr flush dev $interface 2>/dev/null
              ip link set $interface down
              ;;

            bound|renew)
              ip link set $interface up

              ip addr flush dev $interface
              ip addr add ${ip}/${mask:-24} broadcast ${broadcast:-+} dev $interface

              if [ -n "$router" ]; then
                ip route del default 2>/dev/null || true
                for r in $router; do
                  ip route add default via $r dev $interface && break
                done
              fi

              > $RESOLV
              [ -n "$domain" ] && echo "domain $domain" >> $RESOLV
              for ns in $dns; do
                echo "nameserver $ns" >> $RESOLV
              done
              grep -q "nameserver" $RESOLV || echo "nameserver 8.8.8.8" >> $RESOLV

              echo "  ✓ DHCP: IP=$ip GW=${router%% *} DNS=${dns%% *}"
              ;;

            leasefail|nak)
              echo "  ! DHCP başarısız: $1 — statik fallback deneniyor"
  
