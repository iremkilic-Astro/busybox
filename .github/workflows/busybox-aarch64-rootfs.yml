name: BusyBox AArch64 RootFS Build

on:
  workflow_dispatch:
    inputs:
      busybox_version:
        description: "BusyBox version (e.g. 1.36.1)"
        required: false
        default: "1.36.1"

env:
  BUSYBOX_VERSION: ${{ github.event.inputs.busybox_version || '1.36.1' }}
  ARCH: aarch64
  CROSS_COMPILE: aarch64-linux-musl-
  OUTPUT_DIR: ${{ github.workspace }}/output
  ROOTFS_DIR: ${{ github.workspace }}/rootfs
  SYSROOT: ${{ github.workspace }}/sysroot

jobs:
  setup-toolchain:
    name: "Setup AArch64 musl toolchain"
    runs-on: ubuntu-24.04
    outputs:
      toolchain-path: ${{ steps.install.outputs.toolchain_path }}

    steps:
      - name: Install cross-compilation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            wget curl tar xz-utils make gcc g++ \
            libncurses-dev bc bison flex \
            libssl-dev libelf-dev file cpio

      - name: Install musl cross-compiler (aarch64-linux-musl)
        id: install
        run: |
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

          MUSL_URL="https://more.musl.cc/11.4.0/x86_64-linux-musl/aarch64-linux-musl-cross.tgz"
          FALLBACK_URL="https://github.com/musl-cross/musl-cross/releases/download/20231031/aarch64-linux-musl-cross.tgz"

          download_ok=0
          for URL in "$MUSL_URL" "$FALLBACK_URL"; do
            echo "→ Deneniyor: $URL"
            if wget -q --timeout=60 --tries=3 "$URL" -O /tmp/toolchain.tgz; then
              download_ok=1
              break
            fi
            echo "! Başarısız, sonraki deneniyor..."
          done

          if [ $download_ok -eq 1 ]; then
            sudo tar -xzf /tmp/toolchain.tgz -C /opt/
            TPATH="/opt/aarch64-linux-musl-cross/bin"
            echo "✓ Toolchain (musl.cc): $(${TPATH}/aarch64-linux-musl-gcc --version | head -1)"
          else
            echo "! Her iki musl.cc kaynağı başarısız — apt gcc-aarch64 fallback"
            TPATH="/usr/local/bin"
            for tool in gcc ld ar strip objdump objcopy nm readelf; do
              src="/usr/bin/aarch64-linux-gnu-${tool}"
              dst="/usr/local/bin/aarch64-linux-musl-${tool}"
              [ -f "$src" ] && sudo ln -sf "$src" "$dst" || true
            done
            echo "✓ Toolchain (apt fallback): $(aarch64-linux-gnu-gcc --version | head -1)"
          fi

          echo "$TPATH" >> $GITHUB_PATH
          echo "toolchain_path=$TPATH" >> $GITHUB_OUTPUT

      - name: Cache toolchain
        uses: actions/cache/save@v4
        with:
          path: /opt/aarch64-linux-musl-cross
          key: toolchain-aarch64-musl-${{ runner.os }}

  build-busybox:
    name: "Build BusyBox (static, AArch64)"
    runs-on: ubuntu-24.04
    needs: setup-toolchain

    steps:
      - name: Restore toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: /opt/aarch64-linux-musl-cross
          key: toolchain-aarch64-musl-${{ runner.os }}

      - name: Add toolchain to PATH
        run: echo "/opt/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            make gcc libncurses-dev wget

      - name: Download BusyBox source
        run: |
          wget -q "https://busybox.net/downloads/busybox-${BUSYBOX_VERSION}.tar.bz2" \
            -O /tmp/busybox.tar.bz2
          tar -xjf /tmp/busybox.tar.bz2 -C $GITHUB_WORKSPACE
          echo "BUSYBOX_SRC=$GITHUB_WORKSPACE/busybox-${BUSYBOX_VERSION}" >> $GITHUB_ENV

      - name: Generate defconfig
        working-directory: ${{ env.BUSYBOX_SRC }}
        run: |
          make ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE defconfig

      - name: Apply custom kconfig
        working-directory: ${{ env.BUSYBOX_SRC }}
        run: |
          cat > .config << 'KCONFIG'
          CONFIG_STATIC=y
          CONFIG_FEATURE_HAVE_RPC=n
          CONFIG_PAM=n

          CONFIG_LS=y
          CONFIG_CAT=y
          CONFIG_MOUNT=y
          CONFIG_UMOUNT=y
          CONFIG_MKDIR=y
          CONFIG_RM=y
          CONFIG_CP=y
          CONFIG_MV=y
          CONFIG_CHMOD=y
          CONFIG_CHOWN=y
          CONFIG_ECHO=y
          CONFIG_FIND=y
          CONFIG_GREP=y
          CONFIG_SED=y
          CONFIG_AWK=y
          CONFIG_SORT=y
          CONFIG_TAIL=y
          CONFIG_HEAD=y
          CONFIG_WC=y
          CONFIG_UNIQ=y
          CONFIG_TEE=y
          CONFIG_XARGS=y
          CONFIG_EXPR=y
          CONFIG_TEST=y
          CONFIG_DATE=y
          CONFIG_UNAME=y
          CONFIG_WHOAMI=y
          CONFIG_HOSTNAME=y
          CONFIG_PRINTENV=y
          CONFIG_ENV=y
          CONFIG_SLEEP=y
          CONFIG_KILL=y
          CONFIG_PS=y
          CONFIG_FREE=y
          CONFIG_DF=y
          CONFIG_DU=y
          CONFIG_STAT=y
          CONFIG_LN=y
          CONFIG_READLINK=y
          CONFIG_BASENAME=y
          CONFIG_DIRNAME=y
          CONFIG_TRUE=y
          CONFIG_FALSE=y
          CONFIG_YES=y
          CONFIG_PWD=y
          CONFIG_SYNC=y
          CONFIG_MKNOD=y
          CONFIG_MKTEMP=y
          CONFIG_HEXDUMP=y
          CONFIG_OD=y
          CONFIG_DD=y
          CONFIG_TAR=y
          CONFIG_GUNZIP=y
          CONFIG_GZIP=y
          CONFIG_BUNZIP2=y
          CONFIG_BZCAT=y
          CONFIG_UNXZ=y
          CONFIG_XZ=y

          CONFIG_IP=y
          CONFIG_IFCONFIG=y
          CONFIG_UDHCPC=y
          CONFIG_UDHCPD=y
          CONFIG_WGET=y
          CONFIG_PING=y
          CONFIG_PING6=y
          CONFIG_TRACEROUTE=y
          CONFIG_TRACEROUTE6=y
          CONFIG_NETSTAT=y
          CONFIG_ARP=y
          CONFIG_ROUTE=y
          CONFIG_NSLOOKUP=y
          CONFIG_HOST=y
          CONFIG_TELNET=y
          CONFIG_NC=y
          CONFIG_FTPGET=y
          CONFIG_FTPPUT=y
          CONFIG_HTTPD=y
          CONFIG_DNSD=y
          CONFIG_NAMEIF=y
          CONFIG_IPCALC=y
          CONFIG_ETHER_WAKE=y
          CONFIG_FEATURE_IP_ADDRESS=y
          CONFIG_FEATURE_IP_LINK=y
          CONFIG_FEATURE_IP_ROUTE=y
          CONFIG_FEATURE_IP_RULE=y
          CONFIG_FEATURE_IP_TUNNEL=y
          CONFIG_FEATURE_IP_NEIGH=y
          CONFIG_FEATURE_UDHCPC_ARPING=y
          CONFIG_FEATURE_UDHCP_RFC3397=y
          CONFIG_FEATURE_UDHCP_8021Q=y

          CONFIG_INIT=y
          CONFIG_LINUXRC=y
          CONFIG_SYSVINIT=y
          CONFIG_HALT=y
          CONFIG_REBOOT=y
          CONFIG_POWEROFF=y
          CONFIG_GETTY=y
          CONFIG_LOGIN=y
          CONFIG_SH=y
          CONFIG_ASH=y
          CONFIG_HUSH=y
          CONFIG_SYSLOGD=y
          CONFIG_KLOGD=y
          CONFIG_DMESG=y

          CONFIG_FEATURE_MOUNT_FLAGS=y
          CONFIG_FEATURE_MOUNT_FSTAB=y
          CONFIG_FEATURE_MOUNT_HELPERS=y
          CONFIG_FEATURE_MOUNT_LABEL=y
          CONFIG_LOSETUP=y
          CONFIG_FSCK=y
          CONFIG_MKFS_EXT2=y
          CONFIG_TUNE2FS=y
          CONFIG_E2FSCK=y
          CONFIG_MKFS_VFAT=y
          CONFIG_FATATTR=y
          CONFIG_FSTRIM=y
          CONFIG_SWAPON=y
          CONFIG_SWAPOFF=y

          CONFIG_MODPROBE=y
          CONFIG_INSMOD=y
          CONFIG_RMMOD=y
          CONFIG_LSMOD=y
          CONFIG_DEPMOD=y

          CONFIG_STTY=y
          CONFIG_CHROOT=y
          CONFIG_PIVOT_ROOT=y
          CONFIG_SWITCH_ROOT=y
          CONFIG_LSPCI=y
          CONFIG_LSUSB=y
          CONFIG_HDPARM=y
          CONFIG_FDISK=y
          CONFIG_SFDISK=y
          CONFIG_BLKID=y
          CONFIG_FINDFS=y
          CONFIG_NSENTER=y
          CONFIG_UNSHARE=y
          CONFIG_CHRT=y
          CONFIG_TASKSET=y
          CONFIG_NICE=y
          CONFIG_IONICE=y
          KCONFIG

          make ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE olddefconfig 2>&1 | tail -20
      - name: Compile BusyBox
        working-directory: ${{ env.BUSYBOX_SRC }}
        run: |
          make -j$(nproc) \
            ARCH=arm64 \
            CROSS_COMPILE=$CROSS_COMPILE \
            V=0 2>&1 | tee /tmp/busybox-build.log
          echo "✓ Build complete"
          file busybox
          ls -lh busybox

      - name: Verify static linking
        working-directory: ${{ env.BUSYBOX_SRC }}
        run: |
          LIBS=$(${CROSS_COMPILE}readelf -d busybox | grep NEEDED || true)
          if [ -n "$LIBS" ]; then
            echo "❌ HATA: Binary statik değil! Shared lib bulundu:"
            echo "$LIBS"
            exit 1
          fi
          echo "✓ Binary tamamen statik (shared lib yok)"

      - name: Upload busybox binary
        uses: actions/upload-artifact@v4
        with:
          name: busybox-aarch64
          path: ${{ env.BUSYBOX_SRC }}/busybox
          retention-days: 7

  build-rootfs:
    name: "Build RootFS"
    runs-on: ubuntu-24.04
    needs: build-busybox

    steps:
      - name: Checkout (init scripts için)
        uses: actions/checkout@v4

      - name: Download busybox binary
        uses: actions/download-artifact@v4
        with:
          name: busybox-aarch64
          path: /tmp/busybox-bin

      - name: Create rootfs directory structure
        run: |
          mkdir -p $ROOTFS_DIR/{bin,sbin,usr/bin,usr/sbin,lib,lib64,etc,proc,sys,dev,tmp,run,var/{log,run},mnt,root,home}
          mkdir -p $ROOTFS_DIR/etc/{init.d,network/if-up.d,network/if-down.d,udhcpc}
          mkdir -p $ROOTFS_DIR/usr/{lib,share}
          mkdir -p $ROOTFS_DIR/dev

          chmod 1777 $ROOTFS_DIR/tmp
          chmod 700  $ROOTFS_DIR/root
          echo "✓ Dizin yapısı oluşturuldu"

      - name: Install busybox and create symlinks
        run: |
          install -m 755 /tmp/busybox-bin/busybox $ROOTFS_DIR/bin/busybox

          for applet in $($ROOTFS_DIR/bin/busybox --list 2>/dev/null || \
            aarch64-linux-musl-objdump -d /tmp/busybox-bin/busybox | \
            grep -oP '(?<=applet_names\+)\w+' || \
            cat <<-EOF
            ls cat mount umount mkdir rm cp mv chmod chown echo find grep sed
            awk sort tail head wc uniq tee xargs expr test date uname whoami
            hostname printenv env sleep kill ps free df du stat ln readlink
            basename dirname true false yes pwd sync mknod mktemp hexdump od dd
            tar gunzip gzip bunzip2 bzcat unxz xz ip ifconfig udhcpc udhcpd
            wget ping ping6 traceroute netstat arp route nslookup nc telnet
            ftpget ftpput httpd ipcalc init sh ash hush syslogd klogd dmesg
            getty login halt reboot poweroff modprobe insmod rmmod lsmod
            chroot pivot_root switch_root stty blkid fdisk sfdisk losetup
            nsenter unshare chrt taskset nice ionice
          EOF
          ); do
            applet=$(echo $applet | tr -d ' ')
            [ -z "$applet" ] && continue
            case "$applet" in
              mount|umount|ifconfig|ip|route|arp|modprobe|insmod|rmmod|\
              lsmod|depmod|swapon|swapoff|pivot_root|switch_root|losetup|\
              fdisk|sfdisk|blkid|fsck|getty|halt|reboot|poweroff|init)
                ln -sf /bin/busybox $ROOTFS_DIR/sbin/$applet 2>/dev/null || true
                ;;
              *)
                ln -sf /bin/busybox $ROOTFS_DIR/bin/$applet 2>/dev/null || true
                ;;
            esac
          done
          echo "✓ BusyBox symlink'leri oluşturuldu"

      - name: Create /etc/inittab
        run: |
          cat > $ROOTFS_DIR/etc/inittab <<'EOF'

          ::sysinit:/etc/init.d/rcS

          console::respawn:/sbin/getty -L console 0 vt100
          ttyS0::respawn:/sbin/getty -L ttyS0 115200 vt100
          ttyAMA0::respawn:/sbin/getty -L ttyAMA0 115200 vt100

          ::ctrlaltdel:/sbin/reboot

          ::shutdown:/etc/init.d/rcK
          ::shutdown:/bin/umount -a -r
          ::shutdown:/sbin/swapoff -a
          EOF

      - name: Create /etc/init.d/rcS (sysinit)
        run: |
          cat > $ROOTFS_DIR/etc/init.d/rcS <<'SCRIPT'

          echo "==> BusyBox AArch64 RootFS başlatılıyor..."

          echo "[mount] /proc"
          if ! mountpoint -q /proc; then
            mount -t proc     proc     /proc     \
              -o nosuid,noexec,nodev
            [ $? -eq 0 ] && echo "  ✓ /proc mount edildi" \
                         || echo "  ✗ /proc mount HATA!"
          else
            echo "  ✓ /proc zaten mount"
          fi

          echo "[mount] /sys"
          if ! mountpoint -q /sys; then
            mount -t sysfs    sysfs    /sys      \
              -o nosuid,noexec,nodev
            [ $? -eq 0 ] && echo "  ✓ /sys mount edildi" \
                         || echo "  ✗ /sys mount HATA!"
          else
            echo "  ✓ /sys zaten mount"
          fi

          if [ -d /sys/kernel/security ]; then
            mountpoint -q /sys/kernel/security || \
              mount -t securityfs security /sys/kernel/security \
                -o nosuid,noexec,nodev 2>/dev/null || true
          fi

          echo "[mount] /dev"
          if ! mountpoint -q /dev; then
            mount -t devtmpfs devtmpfs /dev       \
              -o nosuid,mode=0755
            if [ $? -ne 0 ]; then
              echo "  ! devtmpfs yok, tmpfs+mknod kullanılıyor"
              mount -t tmpfs tmpfs /dev -o nosuid,mode=0755,size=64k
              mknod -m 666 /dev/null    c 1 3
              mknod -m 666 /dev/zero    c 1 5
              mknod -m 666 /dev/random  c 1 8
              mknod -m 666 /dev/urandom c 1 9
              mknod -m 600 /dev/console c 5 1
              mknod -m 666 /dev/tty     c 5 0
              mknod -m 660 /dev/ttyS0   c 4 64
              mknod -m 660 /dev/ttyAMA0 c 204 64
            fi
            echo "  ✓ /dev mount edildi"
          fi

          mkdir -p /dev/pts
          if ! mountpoint -q /dev/pts; then
            mount -t devpts devpts /dev/pts \
              -o nosuid,noexec,gid=5,mode=0620
            [ $? -eq 0 ] && echo "  ✓ /dev/pts mount edildi" || true
          fi

          mkdir -p /dev/shm
          if ! mountpoint -q /dev/shm; then
            mount -t tmpfs shm /dev/shm \
              -o nosuid,nodev,noexec,mode=1777
            [ $? -eq 0 ] && echo "  ✓ /dev/shm mount edildi" || true
          fi

          echo "[mount] /run"
          if ! mountpoint -q /run; then
            mount -t tmpfs tmpfs /run \
              -o nosuid,nodev,noexec,mode=0755,size=128m
            [ $? -eq 0 ] && echo "  ✓ /run mount edildi" || true
          fi

          if ! mountpoint -q /tmp; then
            mount -t tmpfs tmpfs /tmp \
              -o nosuid,nodev,noexec,mode=1777,size=128m
            [ $? -eq 0 ] && echo "  ✓ /tmp mount edildi" || true
          fi

          HOSTNAME=$(cat /etc/hostname 2>/dev/null || echo "busybox-aarch64")
          hostname "$HOSTNAME"
          echo "  ✓ Hostname: $HOSTNAME"

          sysctl -q -p /etc/sysctl.conf 2>/dev/null || true

          echo "[network] loopback"
          ip link set lo up 2>/dev/null || ifconfig lo up 2>/dev/null || true
          ip addr add 127.0.0.1/8 dev lo 2>/dev/null || true
          echo "  ✓ lo arayüzü aktif"

          echo "[network] eth0"
          if ip link show eth0 > /dev/null 2>&1; then
            ip link set eth0 up
            echo "  → eth0 up, DHCP başlatılıyor..."
            udhcpc -i eth0 -s /etc/udhcpc/default.script \
              -b -t 5 -T 3 -A 10 \
              -p /run/udhcpc.eth0.pid 2>/dev/null || \
            udhcpc -i eth0 -b 2>/dev/null || true
          else
            echo "  ! eth0 bulunamadı, ağ arayüzleri:"
            ip link show 2>/dev/null | grep -E "^[0-9]" || true
          fi

          [ ! -f /etc/resolv.conf ] && cat > /etc/resolv.conf <<RESOLVEOF
          nameserver 8.8.8.8
          nameserver 1.1.1.1
          RESOLVEOF

          syslogd -C 64 2>/dev/null || true
          klogd -c 3   2>/dev/null || true

          echo "==> Başlangıç tamamlandı!"
          echo "    Kernel: $(uname -r)"
          echo "    Arch  : $(uname -m)"
          SCRIPT
          chmod +x $ROOTFS_DIR/etc/init.d/rcS

      - name: Create /etc/init.d/rcK (shutdown)
        run: |
          cat > $ROOTFS_DIR/etc/init.d/rcK <<'SCRIPT'

          echo "==> Sistem kapatılıyor..."

          ip link set eth0 down 2>/dev/null || ifconfig eth0 down 2>/dev/null || true
          ip link set lo down  2>/dev/null || ifconfig lo  down 2>/dev/null || true

          [ -f /run/udhcpc.eth0.pid ] && kill $(cat /run/udhcpc.eth0.pid) 2>/dev/null || true

          echo "  ✓ Ağ bağlantıları kapatıldı"
          echo "==> Güvenli kapatma hazır"
          SCRIPT
          chmod +x $ROOTFS_DIR/etc/init.d/rcK

      - name: Create udhcpc default script
        run: |
          cat > $ROOTFS_DIR/etc/udhcpc/default.script <<'SCRIPT'

          [ -z "$1" ] && echo "Kullanım: $0 <bound|renew|deconfig|leasefail>" && exit 1

          RESOLV=/etc/resolv.conf

          case "$1" in
            deconfig)
              ip addr flush dev $interface 2>/dev/null
              ip link set $interface down
              ;;

            bound|renew)
              ip link set $interface up

              ip addr flush dev $interface
              ip addr add ${ip}/${mask:-24} broadcast ${broadcast:-+} dev $interface

              if [ -n "$router" ]; then
                ip route del default 2>/dev/null || true
                for r in $router; do
                  ip route add default via $r dev $interface && break
                done
              fi

              > $RESOLV
              [ -n "$domain" ] && echo "domain $domain" >> $RESOLV
              for ns in $dns; do
                echo "nameserver $ns" >> $RESOLV
              done
              grep -q "nameserver" $RESOLV || echo "nameserver 8.8.8.8" >> $RESOLV

              echo "  ✓ DHCP: IP=$ip GW=${router%% *} DNS=${dns%% *}"
              ;;

            leasefail|nak)
              echo "  ! DHCP başarısız: $1 — statik fallback deneniyor"
              ip addr add 192.168.1.100/24 dev $interface 2>/dev/null || true
              ip route add default via 192.168.1.1  2>/dev/null || true
              ;;
          esac
          exit 0
          SCRIPT
          chmod +x $ROOTFS_DIR/etc/udhcpc/default.script

      - name: Create system config files
        run: |
          echo "busybox-aarch64" > $ROOTFS_DIR/etc/hostname

          cat > $ROOTFS_DIR/etc/hosts <<'EOF'
          127.0.0.1   localhost
          127.0.1.1   busybox-aarch64
          ::1         localhost ip6-localhost ip6-loopback
          EOF

          cat > $ROOTFS_DIR/etc/passwd <<'EOF'
          root:x:0:0:root:/root:/bin/sh
          daemon:x:1:1:daemon:/usr/sbin:/bin/false
          nobody:x:65534:65534:nobody:/nonexistent:/bin/false
          EOF

          cat > $ROOTFS_DIR/etc/group <<'EOF'
          root:x:0:
          daemon:x:1:
          tty:x:5:
          disk:x:6:
          nogroup:x:65534:
          EOF

          cat > $ROOTFS_DIR/etc/shadow <<'EOF'
          root::19000:0:99999:7:::
          EOF
          chmod 640 $ROOTFS_DIR/etc/shadow

          cat > $ROOTFS_DIR/etc/fstab <<'EOF'
          proc         /proc         proc        nosuid,noexec,nodev          0      0
          sysfs        /sys          sysfs       nosuid,noexec,nodev          0      0
          devtmpfs     /dev          devtmpfs    nosuid,mode=0755             0      0
          devpts       /dev/pts      devpts      nosuid,noexec,gid=5,mode=620 0      0
          shm          /dev/shm      tmpfs       nosuid,nodev,noexec,mode=1777 0     0
          tmpfs        /run          tmpfs       nosuid,nodev,noexec,size=128m 0     0
          tmpfs        /tmp          tmpfs       nosuid,nodev,noexec,mode=1777,size=128m 0 0
          EOF

          cat > $ROOTFS_DIR/etc/sysctl.conf <<'EOF'
          net.ipv4.ip_forward = 1
          net.ipv4.conf.all.rp_filter = 1
          net.ipv4.conf.default.rp_filter = 1
          net.ipv4.icmp_echo_ignore_broadcasts = 1
          net.ipv4.tcp_syncookies = 1

          kernel.dmesg_restrict = 0
          kernel.printk = 3 4 1 3
          EOF

          cat > $ROOTFS_DIR/etc/profile <<'EOF'
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          export PS1='\[\e[1;32m\]\u@\h\[\e[0m\]:\[\e[1;34m\]\w\[\e[0m\]\$ '
          export HOME=/root
          export TERM=vt100
          umask 022
          EOF

          cat > $ROOTFS_DIR/etc/os-release <<'EOF'
          NAME="BusyBox Linux"
          VERSION="${BUSYBOX_VERSION}"
          ID=busybox
          PRETTY_NAME="BusyBox AArch64 RootFS"
          EOF

          cat > $ROOTFS_DIR/root/.profile <<'EOF'
          export PS1='\[\e[1;31m\]root@\h\[\e[0m\]:\[\e[1;34m\]\w\[\e[0m\]# '
          alias ll='ls -alF'
          alias la='ls -A'
          EOF

          echo "✓ Sistem config dosyaları oluşturuldu"

      - name: Package rootfs as tar.gz
        run: |
          mkdir -p $OUTPUT_DIR
          cd $ROOTFS_DIR
          tar -czf $OUTPUT_DIR/busybox-aarch64-rootfs.tar.gz \
            --owner=0 --group=0 \
            --numeric-owner \
            .
          ls -lh $OUTPUT_DIR/busybox-aarch64-rootfs.tar.gz
          echo "✓ rootfs.tar.gz hazır: $(du -sh $OUTPUT_DIR/busybox-aarch64-rootfs.tar.gz | cut -f1)"

      - name: Generate rootfs manifest
        run: |
          echo "# BusyBox AArch64 RootFS Manifest"          > $OUTPUT_DIR/MANIFEST.txt
          echo "Date   : $(date -u)"                        >> $OUTPUT_DIR/MANIFEST.txt
          echo "Version: ${BUSYBOX_VERSION}"                >> $OUTPUT_DIR/MANIFEST.txt
          echo "Arch   : aarch64 (static musl)"             >> $OUTPUT_DIR/MANIFEST.txt
          echo ""                                           >> $OUTPUT_DIR/MANIFEST.txt
          echo "## Directory Tree"                          >> $OUTPUT_DIR/MANIFEST.txt
          find $ROOTFS_DIR -type f | sort | \
            sed "s|$ROOTFS_DIR||" >> $OUTPUT_DIR/MANIFEST.txt
          echo ""                                           >> $OUTPUT_DIR/MANIFEST.txt
          echo "## BusyBox Applets"                         >> $OUTPUT_DIR/MANIFEST.txt
          $ROOTFS_DIR/bin/busybox --list 2>/dev/null | \
            sort >> $OUTPUT_DIR/MANIFEST.txt || true
          cat $OUTPUT_DIR/MANIFEST.txt

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: busybox-aarch64-rootfs
          path: |
            ${{ env.OUTPUT_DIR }}/busybox-aarch64-rootfs.tar.gz
            ${{ env.OUTPUT_DIR }}/MANIFEST.txt
          retention-days: 30

  test-rootfs:
    name: "Smoke Test (QEMU AArch64)"
    runs-on: ubuntu-24.04
    needs: build-rootfs

    steps:
      - name: Install QEMU user-static
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-user-static binfmt-support

      - name: Download rootfs
        uses: actions/download-artifact@v4
        with:
          name: busybox-aarch64-rootfs
          path: /tmp/rootfs-artifact

      - name: Extract rootfs
        run: |
          mkdir -p /tmp/testroot
          tar -xzf /tmp/rootfs-artifact/busybox-aarch64-rootfs.tar.gz \
            -C /tmp/testroot

      - name: Mount proc sys dev (host namespace test)
        run: |
          CHROOT=/tmp/testroot

          echo "── /proc mount testi ──"
          sudo mount -t proc     proc     $CHROOT/proc
          sudo mount -t sysfs    sysfs    $CHROOT/sys
          sudo mount -t devtmpfs devtmpfs $CHROOT/dev    2>/dev/null || \
            sudo mount --bind /dev $CHROOT/dev
          sudo mount -t devpts   devpts   $CHROOT/dev/pts
          sudo mount -t tmpfs    tmpfs    $CHROOT/run    -o size=64m
          sudo mount -t tmpfs    tmpfs    $CHROOT/tmp    -o mode=1777,size=64m

          echo "── Mount noktaları ──"
          mount | grep "$CHROOT"

      - name: Run chroot tests via QEMU
        run: |
          CHROOT=/tmp/testroot
          RUN="sudo chroot $CHROOT /bin/busybox sh -c"

          echo "── /proc kontrolü ──"
          $RUN "cat /proc/version"   && echo "✓ /proc okunabilir"

          echo "── /sys kontrolü ──"
          $RUN "ls /sys/class/"      && echo "✓ /sys okunabilir"

          echo "── /dev kontrolü ──"
          $RUN "ls /dev/null /dev/zero /dev/urandom" && echo "✓ /dev device node'ları mevcut"

          echo "── Ağ araçları ──"
          $RUN "ip --help 2>&1 | head -3"       && echo "✓ ip mevcut"
          $RUN "ifconfig --help 2>&1 | head -3"  && echo "✓ ifconfig mevcut"
          $RUN "wget --help 2>&1 | head -3"      && echo "✓ wget mevcut"
          $RUN "ping -c1 127.0.0.1 2>&1"         && echo "✓ ping çalışıyor"

          echo "── Coreutils ──"
          $RUN "ls / | head -5"     && echo "✓ ls çalışıyor"
          $RUN "cat /etc/hostname"  && echo "✓ cat çalışıyor"
          $RUN "mount --help 2>&1 | head -3" && echo "✓ mount mevcut"

          echo "── Shell ──"
          $RUN "echo 'Merhaba AArch64!'" && echo "✓ shell çalışıyor"
          $RUN "uname -m"               && echo "✓ uname çalışıyor"

          echo ""
          echo "════════════════════════════════"
          echo "✅ Tüm testler başarılı!"
          echo "════════════════════════════════"

      - name: Cleanup mounts
        if: always()
        run: |
          CHROOT=/tmp/testroot
          for mp in dev/pts dev proc sys run tmp; do
            sudo umount -lf $CHROOT/$mp 2>/dev/null || true
          done
          echo "✓ Mount noktaları temizlendi"

  release:
    name: "GitHub Release"
    runs-on: ubuntu-24.04
    needs: test-rootfs
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download rootfs artifact
        uses: actions/download-artifact@v4
        with:
          name: busybox-aarch64-rootfs
          path: ./release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "BusyBox AArch64 RootFS ${{ github.ref_name }}"
          body: |

            - **BusyBox Version**: `${{ env.BUSYBOX_VERSION }}`
            - **Architecture**: `aarch64` (ARM64)
            - **Linking**: Tamamen statik (musl libc, shared lib yok)
            - **Init**: BusyBox init + rcS/rcK scriptleri
            - **Network**: ip, ifconfig, udhcpc (DHCP), wget, ping, nc, traceroute
            - **Mounts**: proc, sys, devtmpfs, devpts, shm, run, tmp — otomatik

            ```bash
            tar -xzf busybox-aarch64-rootfs.tar.gz -C /path/to/rootfs

            sudo chroot /path/to/rootfs /bin/sh
            ```
          files: |
            release/busybox-aarch64-rootfs.tar.gz
            release/MANIFEST.txt
